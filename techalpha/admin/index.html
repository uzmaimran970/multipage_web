<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Admin | TechAlpha</title>
<link rel="stylesheet" href="../css/style.css">
<style>[hidden]{display:none!important}.wrap{padding:40px 0}table{width:100%;border-collapse:collapse;margin-top:16px}
td,th{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}small{color:var(--muted)}
tr.new td{background:rgba(6,182,212,.07)}.tabs{display:flex;gap:10px;margin:20px 0}.tbl{overflow-x:auto}
.btn{padding:8px 14px;font-size:.9rem}.box{max-width:400px;margin:80px auto}</style></head>
<body>
<header class="navbar"><div class="container nav-inner"><a href="../index.html" class="logo">Tech<span>Alpha</span> Admin</a><button class="btn btn-ghost" id="logout">Log out</button></div></header>
<!-- ===== LOGIN ===== -->
<div class="container box" id="login"><div class="card"><h2>Admin login</h2><br>
<form id="loginForm"><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required>
<button class="btn btn-primary" type="submit">Log in</button><p id="loginErr" style="color:#f87171"></p></form></div></div>
<!-- ===== DASHBOARD ===== -->
<div class="container wrap" id="panel" hidden>
<h1>Dashboard</h1>
<div class="tabs"><button class="btn btn-primary" data-tab="tMsg">Messages (<span id="newCount">0</span> new)</button><button class="btn btn-ghost" data-tab="tCourse">Courses</button></div>
<div class="tab" id="tMsg"><div class="tbl"><table><thead><tr><th>Date</th><th>Student</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead><tbody id="msgBody"></tbody></table></div></div>
<div class="tab" id="tCourse" hidden>
<div class="card"><h3 id="formTitle">Add course</h3><br>
<form id="courseForm"><input type="hidden" name="id"><input name="title" placeholder="Course title" required><input name="category" placeholder="Category (e.g. Web Development)">
<input name="price" type="number" min="0" placeholder="Price (Rs)"><input type="hidden" name="image_url">
<label>Course image <input type="file" name="image_file" accept="image/*"></label>
<img id="preview" alt="Image preview" style="max-width:220px;border-radius:10px" hidden><textarea name="description" rows="3" placeholder="Short description"></textarea>
<label><input type="checkbox" name="published" checked style="width:auto"> Show on website</label>
<button class="btn btn-primary" type="submit">Save course</button><p id="courseMsg"></p></form></div>
<div class="tbl"><table><thead><tr><th>Course</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="courseBody"></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script><script src="../js/admin.js"></script>
</body></html>
